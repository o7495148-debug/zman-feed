name: telegram-feed

on:
  schedule:
    - cron: "*/20 * * * *"   # כל 20 דקות (GitHub לפעמים מאחר בכמה דקות)
  workflow_dispatch: {}      # כפתור "Run workflow" להרצה ידנית

permissions:
  contents: write

concurrency:
  group: telegram-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch Telegram posts
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python fetch.py

      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "feed update"
          git push
